<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR del equipo · Retreat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --paper: #f6f3e6; --ink: #1f38b8; --pen: #272a36; --red: #d6243a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: repeating-linear-gradient(transparent 0 29px, rgba(96,130,220,.3) 29px 31px), var(--paper); color: var(--pen); font-family: "Patrick Hand", cursive; }
  h1 { margin: 0; font: 700 42px/1 Caveat, cursive; color: var(--ink); }
  p { margin: 6px 0 18px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 3px solid var(--pen); border-radius: 16px 10px 18px 12px; box-shadow: 5px 6px 0 var(--ink); padding: 12px; text-align: center; break-inside: avoid; }
  .qr { display: grid; place-items: center; margin: 4px auto 8px; }
  .qr img, .qr canvas { width: 150px !important; height: 150px !important; }
  .name { font: 700 28px/1 Caveat, cursive; color: var(--ink); }
  .url { font-size: 14px; word-break: break-all; }
  .url a { color: var(--red); }
  button { margin-bottom: 16px; font: 18px "Patrick Hand"; padding: 6px 14px; border: 2px solid var(--pen); border-radius: 12px; background: #fff; cursor: pointer; }
  @media print { button { display: none; } body { background: #fff; } .card { box-shadow: none; } }
</style>
</head>
<body>
  <h1>QR del equipo</h1>
  <p>Cada QR abre el Retreat con ese personaje ya elegido; al entrar con Google, cada uno confirma que es el suyo.</p>
  <button onclick="print()">🖨️ Imprimir</button>
  <div class="grid" id="grid"></div>
<script>
  const TEAM = [
    ["alejandro", "Alejandro R."], ["ale", "Ale Graciano"], ["alvaro-merino", "Álvaro Merino"], ["alvaro", "Álvaro"],
    ["ana", "Ana"], ["beltran", "Beltrán"], ["bruno", "Bruno"], ["gonzalo", "Gonzalo"], ["javi", "Javi"],
    ["jesus", "Jesús"], ["jose-luis", "José Luis"], ["josu", "Josu"], ["juan", "Juan"], ["maca", "Maca"],
    ["manu", "Manu"], ["pablo", "Pablo"], ["paloma", "Paloma"], ["silvia", "Silvia"]
  ];
  const base = new URLSearchParams(location.search).get("base") || location.origin;
  const grid = document.getElementById("grid");
  for (const [slug, name] of TEAM) {
    const url = `${base.replace(/\/$/, "")}/${slug}`;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="qr"></div><div class="name"></div><div class="url"><a></a></div>`;
    card.querySelector(".name").textContent = name;
    const a = card.querySelector("a"); a.href = url; a.textContent = url;
    grid.appendChild(card);
    new QRCode(card.querySelector(".qr"), { text: url, width: 300, height: 300, colorDark: "#272a36", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  }
</script>
</body>
</html>
